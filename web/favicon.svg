<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DedDrop">
  <!-- The header badge's skull, filled rather than stroked: at 16px a 1.8px
       stroke closes up into a smudge, so the silhouette carries the shape and
       the features are cut back out in the background colour. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#04060a"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none"
        stroke="#e11d48" stroke-opacity="0.55" stroke-width="2"/>

  <!-- The path occupies x 3-21, y 2-21 of its 24-unit box; this scales that
       ink to ~69% of the tile and centres it, rather than centring the box. -->
  <g transform="translate(2.6 3.8) scale(2.45)">
    <path fill="url(#g)"
          d="M12 2C7.03 2 3 6.03 3 11c0 2.8 1.28 5.3 3.3 6.96V20a1 1 0 0 0 1 1h2.5v-2h1v2h2v-2h1v2H16.7a1 1 0 0 0 1-1v-2.04C19.72 16.3 21 13.8 21 11c0-4.97-4.03-9-9-9z"/>
    <circle cx="8.5" cy="11" r="2.1" fill="#04060a"/>
    <circle cx="15.5" cy="11" r="2.1" fill="#04060a"/>
    <path d="M12 14.2l1.5 2.6h-3z" fill="#04060a"/>
  </g>
</svg>
