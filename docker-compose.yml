services:
  deddrop:
    build: .
    container_name: deddrop
    restart: unless-stopped
    ports:
      # host-addr:host-port:container-port. WEB_PORT appears on both sides
      # because the app inside the container binds WEB_PORT, not a fixed 8080.
      # WEB_PUBLISH_ADDR picks which host interface the port is published on —
      # 0.0.0.0 for LAN access (MeshMapper on your phone), 127.0.0.1 to keep it
      # local-only. It is NOT the same knob as WEB_BIND, which is the address
      # *inside* the container and should stay 0.0.0.0 under Docker.
      - "${WEB_PUBLISH_ADDR:-0.0.0.0}:${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    environment:
      # ── Required ──
      TAR1090_URL: ${TAR1090_URL}
      WDGWARS_API_KEY: ${WDGWARS_API_KEY}
      # ── Endpoints ──
      WDGWARS_API_URL: ${WDGWARS_API_URL:-https://wdgwars.pl/endpoint/upload/}
      WDGWARS_ME_URL: ${WDGWARS_ME_URL:-https://wdgwars.pl/api/me}
      MESHMAPPER_API_KEY: ${MESHMAPPER_API_KEY:-}
      # ── Timing ──
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      UPLOAD_INTERVAL_HOURS: ${UPLOAD_INTERVAL_HOURS:-6}
      RETRY_INTERVAL_MINUTES: ${RETRY_INTERVAL_MINUTES:-15}
      # ── Storage ──
      STATE_FILE: ${STATE_FILE:-/data/state/accumulator.json}
      SNAPSHOT_DIR: ${SNAPSHOT_DIR:-/data/snapshots}
      SNAPSHOT_RETENTION: ${SNAPSHOT_RETENTION:-200}
      SAVE_LATEST_RAW: ${SAVE_LATEST_RAW:-true}
      LATEST_RAW_PATH: ${LATEST_RAW_PATH:-/data/latest_raw.json}
      # ── Web dashboard & ingest ──
      WEB_ENABLED: ${WEB_ENABLED:-true}
      # The container's own interfaces only. A host LAN address here cannot be
      # assigned inside the container — publish on it with WEB_PUBLISH_ADDR.
      WEB_BIND: ${WEB_BIND:-0.0.0.0}
      WEB_PORT: ${WEB_PORT:-8080}
      WEB_DIR: ${WEB_DIR:-/app/web}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-8388608}
      # ── Upload tuning ──
      BATCH_SIZE: ${BATCH_SIZE:-500}
      CHUNK_COOLDOWN_S: ${CHUNK_COOLDOWN_S:-1}
      REQUEST_TIMEOUT_S: ${REQUEST_TIMEOUT_S:-60}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      BACKOFF_BASE_S: ${BACKOFF_BASE_S:-2}
      # ── Behaviour ──
      DRY_RUN: ${DRY_RUN:-false}
      RUN_ONCE: ${RUN_ONCE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # The container runs as uid 1000. If ./data does not exist, Docker creates
      # it root-owned and DedDrop cannot write state — see README troubleshooting.
      - ./data:/data
    # Give an in-flight upload time to finish instead of being killed at 10s.
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
