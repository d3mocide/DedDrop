name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor: the codebase uses `X | None` annotations at runtime
        # in function signatures. 3.12 matches the Dockerfile.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes deddrop/ tests/

      - name: Test
        run: python -m unittest discover -s tests -t tests -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t deddrop:ci .

      - name: Smoke test
        run: |
          # RUN_ONCE against an unreachable feed: the container must start,
          # fail the poll cleanly, and exit 0 rather than crash.
          docker run --rm \
            -e TAR1090_URL=http://127.0.0.1:9/aircraft.json \
            -e WDGWARS_API_KEY=0123456789abcdef0123456789abcdef \
            -e DRY_RUN=true \
            -e RUN_ONCE=true \
            -e WEB_ENABLED=false \
            -e STATE_FILE=/tmp/state/accumulator.json \
            -e SNAPSHOT_DIR=/tmp/snapshots \
            -e SAVE_LATEST_RAW=false \
            deddrop:ci
